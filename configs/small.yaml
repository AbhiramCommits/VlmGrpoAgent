# Small tier: Qwen2-VL-2B-Instruct on a single CUDA GPU (>= 8 GB VRAM).
# The committed results were produced with configs/tiny.yaml; this file is the
# documented scale-up recipe and is what `--model-tier small` selects
# automatically on an 8-14 GB GPU.
run_id: small-main
seed: 1234
model_tier: auto
device: auto
dtype: auto

task:
  seed: 1234
  train_n: 800
  val_n: 120
  test_n: 120
  test_hard_n: 120
  image_size: 512
  image_dir: data/images

rollout:
  max_turns: 5
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.95
  do_sample: true
  backend: vllm
  batch_size: 16
  tool_timeout: 2.0

sft:
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lr: 0.0001
  epochs: 3
  batch_size: 8
  grad_accum: 4
  max_length: 2048
  warmup_ratio: 0.03
  max_steps: -1
  full_params: false
  val_every: 50
  val_items: 16

grpo:
  group_size: 8
  steps: 300
  lr: 0.000005
  temperature: 0.9
  clip_eps: 0.2
  kl_beta: 0.02
  last_turn_only: false
  prompts_per_step: 2
  max_length: 2560
  max_new_tokens: 256
  max_turns: 5
  val_every: 25
  val_items: 16
  eval_k: 1
  skip_zero_variance: true
  rollout_backend: vllm

eval:
  k: 4
  max_items: 120
  temperature: 0.8
  max_turns: 5
  max_new_tokens: 256
  batch_size: 16
  split: test

reward:
  w_answer: 1.0
  w_tool: 0.2
  w_trace: 0.3
  w_format: 0.1
  w_length: 0.05
  length_budget: 2000

tracking:
  project: vlm-grpo
  use_wandb: auto
  log_every: 1

data_dir: data
results_dir: results
runs_dir: runs
