name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  VLMGRPO_TIER: stub
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  WANDB_MODE: disabled
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Generate the CI task suite (stub tier, offline)
        run: |
          python -m vlmgrpo.tasks.generate --config configs/ci.yaml \
            --data-dir data/ci --image-dir data/ci/images

      - name: Build SFT data
        run: python -m vlmgrpo.data.build_sft --config configs/ci.yaml

      - name: Unit + end-to-end tests
        run: pytest -q --cov=vlmgrpo --cov-report=term-missing --cov-fail-under=85

      - name: Stub evaluation artifact
        run: |
          python -m vlmgrpo.evaluate --config configs/ci.yaml --checkpoint base \
            --split test --k 1

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: results/ci/
          if-no-files-found: warn
