[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlmgrpo"
version = "0.1.0"
description = "Verifiable-reward GRPO for multimodal tool-using agents"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["vlmgrpo*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["runs", "results", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008", "UP007", "UP038", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end tests that take more than a few seconds",
]

[tool.coverage.run]
branch = true
omit = [
  "vlmgrpo/train_sft.py",
  "vlmgrpo/train_grpo.py",
  "vlmgrpo/train_grpo_trl.py",
  "vlmgrpo/analysis/compare.py",
  "vlmgrpo/analysis/plots.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
